aid: goodr
name: Goodr
description: >-
  Goodr is an Atlanta-based sustainable surplus food management and hunger-relief
  logistics company founded in 2016 by Jasmine Crowe-Houston. Goodr helps businesses
  divert edible and inedible food waste from landfills by scheduling pickups, donating
  surplus edible food to local nonprofits, and providing donors with the tax deductions
  and impact reporting tied to those donations. Alongside its food-waste solutions,
  Goodr runs hunger-relief programs including pop-up grocery markets, meal delivery,
  student snackpacks, and community grocery stores. The company reports more than 30
  million meals served and 4 million pounds of food diverted from landfills for enterprise
  partners such as Amazon, Google, NASA, and Fulton County. Goodr operates through a
  partner portal rather than a public developer API; this profile tracks its public
  web properties in the API Evangelist network.
